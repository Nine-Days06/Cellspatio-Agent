[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellspatio-agent"
version = "0.1.0"
description = "CellSpatio: single-cell and spatiotemporal omics analysis agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.115",
    "uvicorn>=0.27",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "openai>=1.0.0",
    "zhipuai>=2.1.0",
    "openpyxl>=3.1.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.package-data]
"src.knowledge" = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "snapshots",
    "venv",
    ".worktrees",
    ".wrroc",
    "knowledge_base",
    "knowledge_base_methods",
    "data",
    "pubmed-etl/data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 行长由 ruff format 统一控制，避免手写换行与超长 URL 误伤
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 技能加载器依赖 exec 动态编译源码，属设计所需
"src/skills/loader.py" = ["S102"]
# 延迟导入 json 以避免与 WRROC 模型的循环依赖
"src/schemas/workflow.py" = ["E402"]
# 根脚本需先注入 sys.path 才能导入 src.*
"build_pubtator_cache.py" = ["E402"]
"trial_import.py" = ["E402"]
"run_full_import.py" = ["E402"]
# 测试按需在用例内导入被测模块
"tests/**" = ["E402"]
# 一次性脚本先重配置 stdout 编码再导入
"pubmed-etl/revalidate_relevant.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pg: 需要本地 PostgreSQL（tests/conftest.py 会重定向到 rag_test）",
]
