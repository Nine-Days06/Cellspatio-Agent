<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CellSpatio 公共证据</title>
    <link rel="stylesheet" href="./review.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">CellSpatio</span>
        <span class="brand-sub">公共证据</span>
      </div>
      <div id="session" class="session hidden">
        <span id="who" class="who"></span>
        <button id="logout" type="button" class="ghost">退出</button>
      </div>
    </header>

    <main class="shell">
      <section id="login-view" class="login-view hidden">
        <form id="login-form" class="login-card">
          <h1>登录</h1>
          <p class="muted">使用公共服务账号登录，复核证据或贡献自己的证据卡。</p>
          <label>
            <span>用户名</span>
            <input id="username" name="username" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <p id="login-error" class="error" role="alert"></p>
          <button type="submit" class="primary">登录</button>
        </form>
      </section>

      <nav id="view-tabs" class="tabs hidden">
        <button type="button" data-view="review">复核队列</button>
        <button type="button" data-view="contribute">我的贡献</button>
      </nav>

      <section id="workspace" class="workspace hidden">
        <aside class="queue-panel">
          <h2>待审队列 <span id="queue-count" class="count"></span></h2>
          <ul id="queue-list" class="queue-list"></ul>
        </aside>
        <section id="detail" class="detail"></section>
      </section>

      <section id="contribute-view" class="workspace hidden">
        <aside class="queue-panel">
          <h2>我的提交 <span id="mine-count" class="count"></span></h2>
          <ul id="mine-list" class="queue-list"></ul>
          <form id="withdraw-form" class="review-form hidden">
            <p id="withdraw-target" class="muted"></p>
            <textarea id="withdraw-reason" placeholder="撤回原因"></textarea>
            <div class="actions">
              <button type="button" id="withdraw-confirm" class="danger">确认撤回</button>
              <button type="button" id="withdraw-cancel">取消</button>
            </div>
          </form>
        </aside>
        <section id="contribute-detail" class="detail"></section>
      </section>
    </main>

    <p id="toast" class="toast hidden" role="status" aria-live="polite"></p>
    <script type="module" src="./review.js"></script>
  </body>
</html>
